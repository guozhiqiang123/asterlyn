[workspace]
members = ["crates/asterlyn-git", "crates/asterlyn-workspace", "src-tauri"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "UNLICENSED"
rust-version = "1.85"

[workspace.dependencies]
base64 = "0.22"
glob = "0.3"
memchr = "2.7"
notify = "=8.0.0"
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.27"
