[workspace]
members = ["crates/asterlyn-plugin-dependencies", "crates/asterlyn-desktop", "crates/asterlyn-git", "crates/asterlyn-plugin-host", "crates/asterlyn-plugin-marketplace", "crates/asterlyn-plugin-package", "crates/asterlyn-plugin-runtime", "crates/asterlyn-plugin-runtime-protocol", "crates/asterlyn-language-service", "crates/asterlyn-terminal", "crates/asterlyn-workspace", "crates/asterlyn-task", "src-tauri"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "UNLICENSED"
rust-version = "1.88"

[workspace.dependencies]
base64 = "0.22"
flate2 = "1.1"
glob = "0.3"
libc = "0.2"
memchr = "2.7"
notify = "=8.0.0"
portable-pty = "=0.9.0"
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
spdx = "0.10"
tar = "0.4"
tempfile = "3.27"
trash = { version = "=5.2.9", default-features = false, features = ["coinit_multithreaded"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }
