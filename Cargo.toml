[workspace]
members = ["crates/asterlyn-desktop", "crates/asterlyn-git", "crates/asterlyn-terminal", "crates/asterlyn-workspace", "src-tauri"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "UNLICENSED"
rust-version = "1.88"

[workspace.dependencies]
base64 = "0.22"
glob = "0.3"
libc = "0.2"
memchr = "2.7"
notify = "=8.0.0"
portable-pty = "=0.9.0"
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.27"
trash = { version = "=5.2.9", default-features = false, features = ["coinit_multithreaded"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
