[package]
name = "asterlyn"
version = "0.1.11"
description = "A lightweight developer workspace with Git at its center"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "asterlyn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
asterlyn-desktop = { path = "../crates/asterlyn-desktop" }
asterlyn-git = { path = "../crates/asterlyn-git" }
asterlyn-plugin-marketplace = { path = "../crates/asterlyn-plugin-marketplace" }
asterlyn-terminal = { path = "../crates/asterlyn-terminal" }
asterlyn-workspace = { path = "../crates/asterlyn-workspace" }
asterlyn-task = { path = "../crates/asterlyn-task" }
base64.workspace = true
libc.workspace = true
clipboard-rs = { version = "=0.3.5", default-features = false }
notify.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2"
url = "=2.5.8"

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
