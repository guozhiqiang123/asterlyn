[package]
name = "asterlyn-language-service"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
bindings = ["dep:schemars", "asterlyn-process/bindings"]
process-fixtures = []
typescript-fixtures = ["process-fixtures"]
workspace-fixtures = ["typescript-fixtures"]
rust-fixtures = ["typescript-fixtures"]
android-fixtures = ["process-fixtures"]

[dependencies]
tempfile.workspace = true
sha2.workspace = true
url = "=2.5.8"
asterlyn-process = { path = "../asterlyn-process" }
serde.workspace = true
serde_json.workspace = true
schemars = { version = "=0.8.22", optional = true }

[[bin]]
name = "export-language-contract"
path = "src/bin/export-language-contract.rs"
required-features = ["bindings"]


[target.'cfg(unix)'.dependencies]
libc.workspace = true
