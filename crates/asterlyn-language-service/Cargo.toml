[package]
name = "asterlyn-language-service"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
bindings = ["dep:schemars", "asterlyn-process/bindings", "dep:asterlyn-workspace", "asterlyn-workspace/bindings"]
process-fixtures = []
typescript-fixtures = ["process-fixtures"]
workspace-fixtures = ["typescript-fixtures"]
rust-fixtures = ["typescript-fixtures"]
android-fixtures = ["process-fixtures"]

[dependencies]
asterlyn-workspace = { path = "../asterlyn-workspace", optional = true }
tempfile.workspace = true
sha2.workspace = true
url = "=2.5.8"
asterlyn-process = { path = "../asterlyn-process" }
flate2.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
spdx.workspace = true
schemars = { version = "=0.8.22", optional = true }
tar.workspace = true
zip.workspace = true

[[bin]]
name = "export-language-contract"
path = "src/bin/export-language-contract.rs"
required-features = ["bindings"]


[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
